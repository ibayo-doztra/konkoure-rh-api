name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  TZ: UTC
  NODE_ENV: test
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: warn
  APP_KEY: ci-only-key-not-used-outside-this-workflow
  NFC_UID_PEPPER: ci-only-pepper-not-used-outside-this-workflow
  APP_URL: http://localhost:3333
  WEB_APP_URL: http://localhost:8080
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: konkoure_test
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  LIMITER_STORE: memory
  MAIL_MAILER: resend
  MAIL_FROM_NAME: Konkouré
  MAIL_FROM_ADDRESS: support@konkoure.doztra.cloud

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konkoure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations are reversible
        run: |
          node ace migration:run --force
          node ace migration:rollback --batch=0 --force
          node ace migration:run --force
      - run: pnpm test
      - run: pnpm audit --audit-level=high --prod

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t konkoure-api:${{ github.sha }} .
